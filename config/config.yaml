# ============================================================
#  HAUPT-KONFIGURATION – Pattern Recognition Pipeline
# ============================================================

# --- Data Ingestion -------------------------------------------
ingestion:
  exchange: "binance"
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
  timeframe: "1m"
  lookback_days: 30
  rate_limit_ms: 100
  cache:
    enabled: true
    directory: "data/cache"
    format: "parquet"

# --- Feature Engineering --------------------------------------
features:

  momentum:
    rsi:
      periods: [7, 14, 21]
    macd:
      - { fast: 12, slow: 26, signal: 9 }
    roc:
      periods: [5, 10, 20]

  volatility:
    atr:
      periods: [14, 21]
    bollinger:
      - { period: 20, std_dev: 2.0 }
      - { period: 20, std_dev: 3.0 }
    zscore:
      periods: [20, 60]

  volume:
    vwap:
      enabled: true
    volume_spike:
      ma_period: 20
      threshold: 3.0

  time:
    features:
      - "day_of_week"
      - "hour"
      - "minute"
      - "minute_of_day"

  rolling:
    windows: [5, 15, 60, 240]
    metrics:
      - "min"
      - "max"
      - "mean"
      - "std"
    columns: ["close", "volume"]

# --- Forward Returns (Target Variables) -----------------------
forward_returns:
  horizons_minutes: [5, 15, 30, 60, 240]
  metrics:
    - "return"
    - "max_drawdown"
    - "max_runup"

# --- Statistische Auswertung ---------------------------------
statistics:
  min_sample_size: 30
  confidence_level: 0.95
  report:
    format: "csv"
    output_dir: "output/results"
