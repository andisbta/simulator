name: "Volume Spike zur US-Markteroeffnung"
description: >
  Hohes Volumen genau zur US-Markteroeffnung (15:30 UTC+1 = 14:30 UTC),
  kombiniert mit positivem Momentum (ROC > 0).

conditions:
  - column: "hour"
    operator: "=="
    value: 14

  - column: "minute"
    operator: "=="
    value: 30

  - column: "volume_spike_20_3.0"
    operator: "=="
    value: true

  - column: "ROC_10"
    operator: ">"
    value: 0

evaluate:
  target: "return_30m"
  direction: "long"
