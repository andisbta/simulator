name: "MACD Bullish Cross bei niedriger Volatilitaet"
description: >
  MACD-Linie kreuzt ueber die Signal-Linie, waehrend die
  Bollinger Band Width unter dem 20er-Percentil liegt.

conditions:
  - column: "MACDh_12_26_9"
    operator: ">"
    value: 0

  - column: "MACDh_12_26_9_prev"
    operator: "<="
    value: 0

  - column: "BBW_20_2.0"
    operator: "<"
    value_type: "percentile"
    value: 20

evaluate:
  target: "return_60m"
  direction: "long"
