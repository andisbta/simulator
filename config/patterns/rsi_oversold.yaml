name: "RSI Oversold Volume Spike (Hourly Open)"
description: >
  Sucht nach Momenten, in denen der RSI_14 unter 30 faellt,
  gleichzeitig ein Volume Spike vorliegt, und es exakt zur
  vollen Stunde geschieht (Minute == 0).

conditions:
  - column: "RSI_14"
    operator: "<"
    value: 30

  - column: "volume_spike_20_3.0"
    operator: "=="
    value: true

  - column: "minute"
    operator: "=="
    value: 0

evaluate:
  target: "return_15m"
  direction: "long"
